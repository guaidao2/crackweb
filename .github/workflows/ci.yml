name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The same toolchain the release is built with, so a check that passes
      # here cannot fail in the release job for a toolchain reason.
      GOTOOLCHAIN: go1.26.4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build
        run: make build

      # The help output is the first thing a user sees, and it is bilingual.
      # Render both languages so a broken catalogue fails here rather than in
      # someone's terminal.
      - name: Smoke-test the help output
        run: |
          ./bin/crackweb --help > /dev/null
          ./bin/crackweb --lang zh --help > /dev/null
          ./bin/crackweb --version > /dev/null
